<!DOCTYPE html>
<html lang="zh-CN" class="h-full antialiased">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/logo.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://bu.dusays.com" />
    <link rel="dns-prefetch" href="https://bu.dusays.com" />
    <title>宸云 の 宝藏之地</title>
    <script>
      try {
        // Splash screen detection
        if (sessionStorage.getItem('hasSeenSplash') === 'true') {
          document.documentElement.classList.add('splash-seen');
        }

        // Prevent theme color flash: set --hue, --primary, dark mode, card-follow-hue
        // before the first paint, matching what Vue would initialize to.

        // 1. Hue
        var savedHue = localStorage.getItem('blog-hue');
        if (savedHue) {
          document.documentElement.style.setProperty('--hue', savedHue);
        }

        // 2. Primary color (default black for first visit)
        var override = localStorage.getItem('theme.primaryOverride');
        if (override === 'black') {
          document.documentElement.style.setProperty('--primary', '#000000');
        } else if (override === 'white') {
          document.documentElement.style.setProperty('--primary', '#ffffff');
        } else {
          document.documentElement.style.setProperty('--primary', '#000000');
          localStorage.setItem('theme.primaryOverride', 'black');
        }

        // 3. Dark mode (default light)
        var savedTheme = localStorage.getItem('blog-theme');
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        }

        // 4. Card follow hue defaults to off — clean up any stale 'true' from old default
        document.documentElement.classList.remove('card-follow-hue');
        localStorage.setItem('theme.cardFollowHue', 'false');
      } catch (e) {}
    </script>
    <style>
      #app { opacity: 0; visibility: hidden; pointer-events: none; }
      html.splash-seen #app { opacity: 1 !important; visibility: visible !important; pointer-events: auto !important; }
    </style>
  </head>
  <body class="w-screen overflow-x-hidden min-h-full flex flex-col relative transition-colors duration-1000 bg-slate-50 dark:bg-slate-950">
    <div id="app" class="flex-1 flex flex-col transition-opacity duration-1000"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
